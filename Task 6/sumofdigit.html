<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 5837462;

let evenSum = 0;
let oddSum = 0;

while (num > 0) {

    let digit = num % 10;

    if (digit % 2 == 0) {
        evenSum = evenSum + digit;
    }
    else {
        oddSum = oddSum + digit;
    }

    num = Math.floor(num / 10);
}

console.log("Even sum = " + evenSum);
console.log("Odd sum = " + oddSum);
    </script>
</body>
</html>
