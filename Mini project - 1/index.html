
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Calculator</h1>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>English Marks</label>
        <input type="number" id="english" placeholder="Enter marks">

        <label>Maths Marks</label>
        <input type="number" id="maths" placeholder="Enter marks">

        <label>Science Marks</label>
        <input type="number" id="science" placeholder="Enter marks">

        <label>Computer Marks</label>
        <input type="number" id="computer" placeholder="Enter marks">

        <label>DBMS Marks</label>
        <input type="number" id="dbms" placeholder="Enter marks">

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
